name: Manual CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Test release guards
        run: node --test scripts/for_release/*.test.mjs
      - name: Run the complete local gate
        run: yarn ci

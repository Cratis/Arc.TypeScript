name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Arc's shared pages are checked out at default-branch HEAD, not from this repo's diff.
  # Run weekly (and on demand) so Arc-only page changes also exercise this e2e.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.classify.outputs.code }}
      drizzle: ${{ steps.classify.outputs.drizzle }}
      tutorial: ${{ steps.classify.outputs.tutorial }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for code changes
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == schedule ]]; then
            { echo 'code=false'; echo 'drizzle=false'; echo 'tutorial=true'; echo 'docs=false'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == workflow_dispatch || "$BASE" =~ ^0+$ ]]; then
            { echo 'code=true'; echo 'drizzle=true'; echo 'tutorial=true'; echo 'docs=false'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD | bash scripts/classify-changes.sh >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@2fa2cb4fedb8048c4afb7f1a14e0103a35b0f1ce
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Check documentation
        run: yarn build && yarn docs:lint && yarn docs:snippets:self-test && yarn docs:snippets && yarn docs:examples:self-test && yarn docs:examples

  drizzle-integration:
    needs: changes
    if: needs.changes.outputs.drizzle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@2fa2cb4fedb8048c4afb7f1a14e0103a35b0f1ce
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build integration dependencies
        run: yarn build
      - name: Run PostgreSQL Drizzle integration
        run: bash Source/Drizzle/run-integration.sh postgresql

  tutorial-e2e:
    needs: changes
    if: needs.changes.outputs.tutorial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TypeScript backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out shared Arc tutorial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Cratis/Arc
          path: .arc-tutorial-source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@2fa2cb4fedb8048c4afb7f1a14e0103a35b0f1ce
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Check tutorial assembler negative cases
        run: python3 Documentation/tutorial-e2e/assemble.py --self-test
      - name: Build packages and run scratch tutorial with isolated MongoDB replica set
        env:
          ARC_DOCUMENTATION: ${{ github.workspace }}/.arc-tutorial-source/Documentation
        run: yarn build && bash Documentation/tutorial-e2e/run.sh

  verify-artifacts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@2fa2cb4fedb8048c4afb7f1a14e0103a35b0f1ce
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build packages and check generated artifacts and consumers
        run: yarn ci:artifacts

  verify-quality:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@2fa2cb4fedb8048c4afb7f1a14e0103a35b0f1ce
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build prerequisites
        run: yarn build
      - name: Lint and typecheck
        run: yarn ci:quality

  verify-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@2fa2cb4fedb8048c4afb7f1a14e0103a35b0f1ce
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build prerequisites
        run: yarn build
      - name: Run unit, client contract, decorator and Library end-to-end tests
        run: yarn ci:tests

  verify-docs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Cache Yarn packages
        uses: Cratis/Workflows/.github/actions/yarn-cache@2fa2cb4fedb8048c4afb7f1a14e0103a35b0f1ce
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build prerequisites
        run: yarn build
      - name: Check documentation, release scripts and version consistency
        run: yarn ci:docs

  # Preserve the existing check name, including intentionally skipped code checks.
  verify:
    needs: [changes, verify-artifacts, verify-quality, verify-tests, verify-docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every code check to succeed when code changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$CODE" == true ]]; then
            jq -e 'all(. == "success")' <<< "$RESULTS"
          else
            jq -e 'all(. == "success" or . == "skipped")' <<< "$RESULTS"
          fi

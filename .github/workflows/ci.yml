name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Arc's shared pages are checked out at default-branch HEAD, not from this repo's diff.
  # Run weekly (and on demand) so Arc-only page changes also exercise this e2e.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.classify.outputs.code }}
      drizzle: ${{ steps.classify.outputs.drizzle }}
      tutorial: ${{ steps.classify.outputs.tutorial }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for code changes
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == schedule ]]; then
            { echo 'code=false'; echo 'drizzle=false'; echo 'tutorial=true'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == workflow_dispatch || "$BASE" =~ ^0+$ ]]; then
            { echo 'code=true'; echo 'drizzle=true'; echo 'tutorial=true'; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          if [[ -z "$files" ]]; then
            echo 'No changed files to classify' >&2
            exit 2
          fi
          code=false
          drizzle=false
          tutorial=false
          while IFS= read -r file; do
            case "$file" in
              Documentation/client-snippets/tutorial/*|Documentation/client-snippets/arc-without-event-sourcing/*|Documentation/tutorial-e2e/*|Documentation/validate-client-snippets.py|Source/MongoDB/*|Source/Core/*|Source/Tools/ProxyGenerator/*|.github/workflows/ci.yml|package.json|yarn.lock) tutorial=true ;;
            esac
            case "$file" in
              Source/Drizzle/*|Documentation/sql/observing-postgresql.md|.github/workflows/ci.yml|package.json|yarn.lock) drizzle=true ;;
            esac
            case "$file" in
              Documentation/*|*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          { echo "code=$code"; echo "drizzle=$drizzle"; echo "tutorial=$tutorial"; } >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Check documentation
        run: yarn build && yarn docs:lint && yarn docs:snippets:self-test && yarn docs:snippets && yarn docs:examples:self-test && yarn docs:examples

  drizzle-integration:
    needs: changes
    if: needs.changes.outputs.drizzle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build integration dependencies
        run: yarn build
      - name: Run PostgreSQL Drizzle integration
        run: bash Source/Drizzle/run-integration.sh postgresql

  tutorial-e2e:
    needs: changes
    if: needs.changes.outputs.tutorial == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out TypeScript backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out shared Arc tutorial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Cratis/Arc
          path: .arc-tutorial-source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Build packages and run scratch tutorial with isolated MongoDB replica set
        env:
          ARC_DOCUMENTATION: ${{ github.workspace }}/.arc-tutorial-source/Documentation
        run: yarn build && bash Documentation/tutorial-e2e/run.sh

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
      - name: Enable Yarn from the repository package manager
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      - name: Run the complete local gate
        run: yarn ci

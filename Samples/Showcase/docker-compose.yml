name: arc-typescript-showcase
services:
  # A one-node replica set: change streams, and so the live MongoDB pages, need one.
  mongo:
    image: mongo:7.0
    container_name: arc-typescript-showcase-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }\" | grep -q 1"]
      interval: 3s
      timeout: 10s
      retries: 30
